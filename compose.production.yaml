name: intelliq

x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the internal postgres host}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL to the internal redis host}
  DATA_MODE: ${DATA_MODE:-live}
  TIMECUE_API_URL: ${TIMECUE_API_URL:?set TIMECUE_API_URL}
  JOBS_ENABLED: ${JOBS_ENABLED:-true}
  SIMULATION_PROCESS_ENABLED: ${SIMULATION_PROCESS_ENABLED:-true}
  SIMULATION_TIMEOUT_SECONDS: ${SIMULATION_TIMEOUT_SECONDS:-180}
  SIMULATION_MAX_PROJECTS: ${SIMULATION_MAX_PROJECTS:-0}
  SIMULATION_MAX_WORKERS: ${SIMULATION_MAX_WORKERS:-0}
  SIMULATION_MAX_TASKS: ${SIMULATION_MAX_TASKS:-0}
  SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?set SESSION_ENCRYPTION_KEY}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  WEATHERAPI_API_KEY: ${WEATHERAPI_API_KEY:-}
  OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
  WEATHER_FORECAST_DAYS: ${WEATHER_FORECAST_DAYS:-7}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
  NLP_ENABLED: ${NLP_ENABLED:-true}
  ALLOW_EXTERNAL_TEXT_PROCESSING: ${ALLOW_EXTERNAL_TEXT_PROCESSING:-false}
  UPLOAD_DIR: /app/data/uploads
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set the S3 endpoint reachable by API and worker}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_CREATE_BUCKET: "false"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - intelliq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - intelliq-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    command: ["uv", "run", "python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - intelliq-uploads:/app/data/uploads
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "uvicorn",
        "src.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "30",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 40s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    command: ["uv", "run", "python", "-m", "arq", "src.app.workers.worker.WorkerSettings"]
    volumes:
      - intelliq-uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 20s

  reverse-proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./apps/reverse-proxy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - intelliq-caddy-data:/data
      - intelliq-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  intelliq-postgres-data:
  intelliq-redis-data:
  intelliq-uploads:
  intelliq-caddy-data:
  intelliq-caddy-config:
